services:
  postgres:
    image: postgres:16-alpine
    container_name: bace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bace
      POSTGRES_PASSWORD: bace_secret
      POSTGRES_DB: bace_crm
    ports:
      - "5433:5432"
    volumes:
      - bace_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bace -d bace_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - bace_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: bace-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bace_minio
      MINIO_ROOT_PASSWORD: bace_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - bace_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bace_pg_data:
  bace_redis_data:
  bace_minio_data:
